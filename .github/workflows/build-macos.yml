---
name: 🍎 Build - MacOS
on:
  workflow_call:
    inputs:
      docs-artifact-name:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
#          - os: macos-13
#            triplet: x64-osx
#            deployment-target: "10.15"
          - os: macos-26
            triplet: arm64-osx-dynamic
            # Needs to be aligned with vcpkg/triplets/arm64-osx-dynamic.cmake
            deployment-target: "13.0"
    name: build (macos)
    runs-on: ${{ matrix.os }}

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.docs-artifact-name }}
          path: share/docs/html/

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          # Pin to specific version to avoid rebuilding too often
          # Also helps to avoid spurious build failures like https://github.com/qgis/QGIS/pull/47098
          cmakeVersion: 3.29.0

      - name: 🔨 Prepare build env
        run: |
          brew install automake bison flex gnu-sed create-dmg autoconf-archive nasm libtool fdupes swig mono
          echo $(brew --prefix bison)/bin >> $GITHUB_PATH
          echo $(brew --prefix flex)/bin >> $GITHUB_PATH
          echo $(brew --prefix libtool)/bin >> $GITHUB_PATH

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 🍭 Setup XCode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup oras
        uses: oras-project/setup-oras@v2

      - name: Fetch tif
        run: |
          oras pull ghcr.io/kadas-albireo/kadas-albireo2/dtm_analysis:1.0 -o .

      - name: 🔢 Determine version
        id: version
        uses: ./.github/actions/determine-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌱 Install dependencies and generate project files
        env:
          GDAL_PYTHON_BINDINGS_WITHOUT_NUMPY: "Yes"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install first only with binarycaching, then deduplicate binaries and replace copies with symlinks.
          # Nuget doesn't understand the symlink concept

          cmake -S . \
                -G Ninja \
                -B build \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} \
                -D KADAS_VERSION=${{ steps.version.outputs.version }} \
                -D CPACK_PACKAGE_FILE_NAME="kadas-macos-arm64-$(date +'%Y-%m-%d_%H%M')" \
                -D VCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
                -D VCPKG_HOST_TRIPLET="${{ matrix.triplet }}" \
                -D VCPKG_INSTALL_OPTIONS="--only-binarycaching" \
                -D NUGET_USERNAME=kadas-albireo \
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }} || true
                
          fdupes -r -1 build/vcpkg_installed/arm64-osx-dynamic/lib | grep libQt | while read line; do master=""; for file in ${line[*]}; do if  [[ "x${master}" == "x" ]]; then master=$file; else rm "${file}"; ln -s $(basename "${master}") "${file}"; fi; done; done

          cmake -D VCPKG_INSTALL_OPTIONS="" build

      - name: 📑 Upload vcpkg build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ matrix.triplet }}
          path: |
            build/_deps/vcpkg-src/buildtrees/**/*.log

      - name: 📦 Create SDK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          ./build/_deps/vcpkg-src/vcpkg export --zip --output-dir=./sdk --x-install-root=./build/vcpkg_installed  --x-manifest-root=vcpkg
          cd sdk && for f in vcpkg-export-*.zip; do mv "$f" "${f/vcpkg-export/vcpkg-export-${{ matrix.triplet }}}"; done

      - name: 📤 Upload SDK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: sdk/vcpkg-export-${{ matrix.triplet }}-*.zip

      - name: 📝 Compile plugins translation
        run: |
          # lrelease is run from cmake for app
          # plugins need to be handled
          export PATH="${{ github.workspace }}/build/vcpkg_installed/${{ matrix.triplet }}/tools/Qt6/bin:${PATH}"
          for PLUGIN in about gpkg print ephem; do
            lrelease share/python/plugins/kadas_${PLUGIN}/i18n/*.ts
          done

      - name: 🌋 Build
        run: |
          cmake --build build

      - name: 🧪 Run CTest
        run: |
          ctest --test-dir build --output-on-failure --timeout 120

      - name: 🧪 Install pytest for plugin tests
        run: |
          ./build/vcpkg_installed/${{ matrix.triplet }}/tools/python3/python3 -m pip install pytest

      - name: 🧪 Run plugin tests
        env:
          PYTHONPATH: "${{ github.workspace }}/build/output/python:${{ github.workspace }}/share/python/plugins"
          DYLD_LIBRARY_PATH: "${{ github.workspace }}/build/vcpkg_installed/${{ matrix.triplet }}/lib"
        run: |
          ./build/vcpkg_installed/${{ matrix.triplet }}/tools/python3/python3 \
            -m pytest share/python/plugins/kadas_gpkg/tests/ -v

      - name: 📦 Package
        run: |
          cmake --build build --target bundle

      - name: 📤 Upload dmg
        id: upload-dmg
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            build/kadas-macos-*.dmg

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name == 'release' }}
        with:
          files: |
            build/kadas-macos-*.dmg

      - name: 💬 Sticky comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: macos-artifacts
          message: |
            ## 🍎 macOS Build Artifacts

            📦 [Download dmg](${{ steps.upload-dmg.outputs.artifact-url }})

            _The app is not notarized, run `xattr -d com.apple.quarantine "/Applications/KADAS Albireo.app"` after installing it to avoid the warning._

            <sub>Built from ${{ github.event.pull_request.head.sha }} • [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
